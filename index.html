<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A guided, in-browser machine learning workbench: load a table, pick a column to predict, train, tune and use models.">
<title>Tabula Model Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --sunken: #E9EDF2;
  --ink: #131A22;
  --ink-2: #47525E;
  --ink-3: #75808C;
  --line: #DAE0E7;
  --line-2: #C7CFD8;
  --grid: #E6EAEF;
  --accent: #4136B0;
  --accent-hover: #362CA0;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECEAFB;
  --accent-line: #C9C4F2;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --good: #1D7F46;
  --good-soft: #E3F4EA;
  --warning: #9A6200;
  --warning-soft: #FCF1DC;
  --serious: #B8430E;
  --serious-soft: #FCE8DD;
  --critical: #B42318;
  --critical-soft: #FDE7E5;
  --info: #3A5A85;
  --info-soft: #E6EEF8;
  --shadow: 0 1px 2px rgba(19,26,34,.06), 0 4px 16px rgba(19,26,34,.06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1217; --surface: #141B22; --surface-2: #18212A; --sunken: #0F151B;
    --ink: #E6ECF2; --ink-2: #A9B4BF; --ink-3: #7C8895; --line: #26313C; --line-2: #34414E; --grid: #202A34;
    --accent: #9C93F2; --accent-hover: #B0A8F6; --accent-ink: #15112F; --accent-soft: #221F45; --accent-line: #3D3877;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --good: #4CC98A; --good-soft: #12291D; --warning: #E7B04A; --warning-soft: #2C230F; --serious: #F08A55; --serious-soft: #311A10; --critical: #F2776B; --critical-soft: #331513; --info: #8FB4E8; --info-soft: #152233;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1217; --surface: #141B22; --surface-2: #18212A; --sunken: #0F151B;
  --ink: #E6ECF2; --ink-2: #A9B4BF; --ink-3: #7C8895; --line: #26313C; --line-2: #34414E; --grid: #202A34;
  --accent: #9C93F2; --accent-hover: #B0A8F6; --accent-ink: #15112F; --accent-soft: #221F45; --accent-line: #3D3877;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --good: #4CC98A; --good-soft: #12291D; --warning: #E7B04A; --warning-soft: #2C230F; --serious: #F08A55; --serious-soft: #311A10; --critical: #F2776B; --critical-soft: #331513; --info: #8FB4E8; --info-soft: #152233;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 750; line-height: 1.12; }
h2 { font-size: 18px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* app frame */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 750; font-size: 19px; letter-spacing: -0.02em; flex: none; }
.brand svg { display: block; }
.dataset-chip { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.dataset-chip b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.top .spacer { flex: 1; }
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr) 360px; min-height: 0; }
.shell.no-assist { grid-template-columns: 228px minmax(0, 1fr); }
.rail { border-right: 1px solid var(--line); background: var(--surface-2); padding: 18px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.rail .label { padding: 4px 10px 8px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: start; text-align: left; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; }
.step:hover:not(:disabled) { background: var(--surface); border-color: var(--line); }
.step[aria-current="step"] { background: var(--surface); border-color: var(--accent-line); box-shadow: var(--shadow); }
.step:disabled { cursor: not-allowed; opacity: .5; }
.step .dot { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); border: 1.5px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
.step.done .dot { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.step[aria-current="step"] .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.step .s { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; }
.rail .sep { height: 1px; background: var(--line); margin: 10px 8px; }
main { overflow-y: auto; min-width: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-block: 28px 64px; padding-inline: 28px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 8px; }
.page-head p.lede { color: var(--ink-2); max-width: 68ch; font-size: 15px; }
.eyebrow { font: 500 12px var(--mono); color: var(--accent); letter-spacing: .02em; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid-eval { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { justify-content: space-between; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; font-size: 14px; cursor: pointer; line-height: 1.2; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--sunken); border-color: transparent; }
.btn.danger { color: var(--critical); border-color: var(--critical); background: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.lg { padding: 11px 18px; font-size: 15px; }
.link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 10px; font-size: 14px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
select { padding-right: 28px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field input, .field select { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; padding: 3px; gap: 3px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: none; background: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
input[type=range] { accent-color: var(--accent); width: 100%; }

/* pills + notes */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.pill.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.pill.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.warning { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
.pill.serious { background: var(--serious-soft); border-color: transparent; color: var(--serious); }
.pill.critical { background: var(--critical-soft); border-color: transparent; color: var(--critical); }
.type { font: 500 11px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--sunken); color: var(--ink-2); text-transform: lowercase; }
.note { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--info-soft); }
.note .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--mono); color: var(--surface); background: var(--info); }
.note.warning { background: var(--warning-soft); } .note.warning .ic { background: var(--warning); }
.note.serious { background: var(--serious-soft); } .note.serious .ic { background: var(--serious); }
.note.critical { background: var(--critical-soft); } .note.critical .ic { background: var(--critical); }
.note.good { background: var(--good-soft); } .note.good .ic { background: var(--good); }
.note b { display: block; font-weight: 600; }
.note p { color: var(--ink-2); font-size: 13.5px; }
.note .row { margin-top: 8px; }

/* data */
.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { background: var(--surface-2); font-weight: 600; position: sticky; top: 0; z-index: 1; }
table.data td.n, table.data th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.data tbody tr:last-child td { border-bottom: none; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--surface-2); }
table.data tr.sel td { background: var(--accent-soft); }
table.data .th-type { display: block; margin-top: 2px; }
.preview { max-height: 420px; overflow: auto; }
.cell-miss { color: var(--ink-3); font-style: italic; }

/* dropzone */
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 26px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .glyph { width: 46px; height: 46px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); flex: none; }
.drop .txt { flex: 1; min-width: 200px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sample { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.sample:hover { border-color: var(--accent-line); }
.sample[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sample .k { font: 500 11.5px var(--mono); color: var(--ink-3); }
.sample b { font-weight: 600; }
.sample span { font-size: 13px; color: var(--ink-2); }

/* column picker */
.colpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.colbtn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.colbtn:hover:not(:disabled) { border-color: var(--accent-line); }
.colbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.colbtn:disabled { opacity: .45; cursor: not-allowed; }
.colbtn .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.colbtn .ex { font: 12px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* algorithms */
.algos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.algo { display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.algo:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); }
.algo input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.algo b { font-weight: 600; }
.algo p { grid-column: 2; font-size: 13px; color: var(--ink-2); }
.algo.locked { cursor: default; opacity: .8; }

/* progress */
.progress { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 0; transition: width .25s; }
.bar.indet > i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile.main { border-color: var(--accent-line); }
.tile .v { font: 500 24px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile .c { font-size: 12.5px; color: var(--ink-3); }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 11px var(--mono); fill: var(--ink-3); }
.chart .axis-title { font: 500 11.5px var(--sans); fill: var(--ink-2); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.chart .pt { fill: var(--series-1); fill-opacity: .6; stroke: var(--surface); stroke-width: 1; }
.chart .pt:hover { fill-opacity: 1; r: 6; }
.chart .hov { fill: transparent; }
.chart .hov:hover { fill: var(--ink); fill-opacity: .06; }
.chart .hbar { fill: var(--series-1); fill-opacity: .8; }
.chart .hbar:hover { fill-opacity: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.band { height: 10px; opacity: .25; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.45 var(--mono); padding: 7px 10px; border-radius: 6px; white-space: pre-line; max-width: 280px; box-shadow: var(--shadow); }
.bars { display: flex; flex-direction: column; gap: 7px; }
.hb { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 58px; gap: 10px; align-items: center; font-size: 13px; }
.hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .track { height: 10px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.hb .track i { display: block; height: 100%; background: var(--series-1); border-radius: 0 3px 3px 0; }
.hb .val { text-align: right; font: 12.5px var(--mono); color: var(--ink-2); }
.hb.zero .nm { color: var(--ink-3); }
.cm { display: grid; gap: 3px; font-size: 12.5px; }
.cm .h { font-weight: 600; color: var(--ink-2); padding: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm .c { border-radius: 5px; padding: 10px 6px; text-align: center; font-family: var(--mono); min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
.cm .c small { display: block; font-size: 11px; opacity: .8; }
.effect { display: grid; grid-template-columns: minmax(90px, 36%) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.effect .axis { position: relative; height: 18px; }
.effect .axis::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.effect .axis i { position: absolute; top: 4px; height: 10px; border-radius: 2px; }
.effect .axis span { position: absolute; top: 0; font: 11.5px var(--mono); color: var(--ink-2); white-space: nowrap; }

/* results */
.big-pred { font: 600 34px var(--mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pbar { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 54px; gap: 10px; align-items: center; font-size: 13.5px; }
.pbar .track { height: 12px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.pbar .track i { display: block; height: 100%; background: var(--series-1); }
.pbar.win .track i { background: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.empty { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-2); }

/* library */
.model { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.model .meta { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.model .meta b { font-weight: 600; color: var(--ink); }
.panel { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }

/* assistant */
.assist { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.assist-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.assist-head h2 { font-size: 16px; }
.assist-head .spacer { flex: 1; }
.spark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { font-size: 14px; line-height: 1.55; max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--ink); padding: 8px 12px; border-radius: 12px 12px 3px 12px; max-width: 88%; white-space: pre-wrap; }
.msg.assistant { color: var(--ink); }
.msg.assistant p + p, .msg.assistant p + ul, .msg.assistant ul + p, .msg.assistant p + ol, .msg.assistant ol + p { margin-top: 8px; }
.msg.assistant ul, .msg.assistant ol { margin: 0; padding-left: 20px; }
.msg.assistant li + li { margin-top: 3px; }
.msg.assistant code { font: 12.5px var(--mono); background: var(--sunken); padding: 1px 4px; border-radius: 4px; }

<script>
(function () {
'use strict';
const Eng = window.TabulaEngine;
const $ = s => document.querySelector(s);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = esc;

/* ================= engine runner (worker with main-thread fallback) ================= */
const PROG = { runExperiment: 1, tune: 1, fitFinal: 1, runForecast: 1, tuneForecast: 1, trainCandidate: 1 };
let worker = null, workerOk = false; const jobs = new Map(); let jobSeq = 0;
function runLocal(fn, args, onProgress) {
  return new Promise((res, rej) => setTimeout(() => {
    try { const a = args.slice(); if (PROG[fn]) { while (a.length < Eng[fn].length - 1) a.push(undefined); a.push(onProgress || (() => {})); } res(Eng[fn].apply(null, a)); }
    catch (e) { rej(e); }
  }, 40));
}
try {
  worker = new Worker('engine.js');
  workerOk = true;
  worker.onmessage = ev => {
    const d = ev.data; const j = jobs.get(d.id); if (!j) return;
    if (d.progress) { j.onProgress && j.onProgress(d.progress); return; }
    jobs.delete(d.id);
    if (d.error) j.rej(new Error(d.error)); else j.res(d.result);
  };
  worker.onerror = ev => {
    ev.preventDefault && ev.preventDefault();
    workerOk = false;
    const pending = Array.from(jobs.values()); jobs.clear();
    pending.forEach(j => runLocal(j.fn, j.args, j.onProgress).then(j.res, j.rej));
  };
} catch (e) { workerOk = false; }
function run(fn, args, onProgress) {
  if (workerOk) return new Promise((res, rej) => { const id = ++jobSeq; jobs.set(id, { res, rej, onProgress, fn, args }); worker.postMessage({ id, fn, args }); });
  return runLocal(fn, args, onProgress);
}

/* ================= storage (IndexedDB, falls back to memory) ================= */
const Store = {
  db: null, mem: { models: new Map(), data: new Map() },
  async open() {
    if (this.db !== null) return this.db;
    this.db = await new Promise(res => {
      try {
        const rq = indexedDB.open('tabula', 1);
        rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('models')) d.createObjectStore('models', { keyPath: 'id' }); if (!d.objectStoreNames.contains('data')) d.createObjectStore('data'); };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => res(false); rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
    return this.db;
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    if (!db) return fn(null);
    return new Promise((res, rej) => { try { const t = db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result !== undefined ? r.result : r); t.onerror = () => rej(t.error); } catch (e) { rej(e); } });
  },
  async allModels() { const db = await this.open(); if (!db) return Array.from(this.mem.models.values()); return this.tx('models', 'readonly', s => s.getAll()); },
  async putModel(m) { const db = await this.open(); if (!db) { this.mem.models.set(m.id, m); return; } return this.tx('models', 'readwrite', s => s.put(m)); },
  async delModel(id) { const db = await this.open(); if (!db) { this.mem.models.delete(id); this.mem.data.delete(id); return; } await this.tx('models', 'readwrite', s => s.delete(id)); await this.tx('data', 'readwrite', s => s.delete(id)); },
  async putData(id, v) { const db = await this.open(); if (!db) { this.mem.data.set(id, v); return; } return this.tx('data', 'readwrite', s => s.put(v, id)); },
  async getData(id) { const db = await this.open(); if (!db) return this.mem.data.get(id); return this.tx('data', 'readonly', s => s.get(id)); },
  persistent() { return !!this.db; }
};

/* ================= state ================= */
const STEPS = [
  { id: 'data', t: 'Load data', s: 'Upload a table or try a sample' },
  { id: 'goal', t: 'Choose a goal', s: 'Pick what to predict' },
  { id: 'prepare', t: 'Prepare columns', s: 'Choose inputs, fix types' },
  { id: 'train', t: 'Train models', s: 'Compare algorithms' },
  { id: 'evaluate', t: 'Evaluate & tune', s: 'Understand, improve, save' },
  { id: 'predict', t: 'Predict', s: 'Use a saved model' },
];
const S = {
  step: 'data', visited: {},
  table: null, profile: null, source: null,
  goal: { target: null, task: null, dateCol: null, agg: 'sum', horizon: null },
  cols: {}, split: { validFrac: 0.2, orderBy: '' }, maxRows: 20000, detrend: true,
  algos: ['baseline', 'linear', 'forest', 'boosting'], metric: null, params: {},
  busy: null, exp: null, expHash: null, selKey: null, inspect: {}, threshold: 0.5,
  tune: null, saveName: '', savedFromExp: false,
  models: [], activeModel: null,
  pred: { form: {}, single: null, batch: null, horizon: null, fc: null },
  lib: { open: null, mode: null, check: null, retrain: null, confirmDel: null },
  chat: [], assistOpen: window.innerWidth > 1240,
};
const TASK_WORD = { regression: 'Predict a number', classification: 'Predict a category', forecast: 'Forecast over time' };
const METRIC_SETS = { regression: ['rmse', 'mae', 'r2', 'mape'], classification: ['accuracy', 'auc', 'macro_f1', 'balanced_accuracy', 'logloss'], forecast: ['mae', 'rmse', 'smape'] };
const SHOWN = { regression: ['rmse', 'mae', 'r2'], classification: ['accuracy', 'auc', 'macro_f1'], forecast: ['mae', 'rmse', 'smape'] };

/* ================= formatting ================= */
function fmtNum(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (a >= 1000) return Math.round(v).toLocaleString('en-US');
  if (a >= 100) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  if (a === 0) return '0';
  return v.toPrecision(3);
}
function fmtFull(v) { if (v === null || v === undefined || isNaN(v)) return '—'; const a = Math.abs(v); return a >= 1000 ? Math.round(v).toLocaleString('en-US') : a >= 10 ? v.toFixed(1) : v.toFixed(3).replace(/\.?0+$/, ''); }
function fmtMetric(m, v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  if (['accuracy', 'balanced_accuracy', 'macro_f1', 'precision', 'recall'].includes(m)) return (v * 100).toFixed(1) + '%';
  if (m === 'mape' || m === 'smape') return v.toFixed(1) + '%';
  if (m === 'auc' || m === 'r2' || m === 'logloss') return v.toFixed(3);
  return fmtNum(v);
}
function fmtDate(t, freq) { const iso = new Date(t).toISOString(); if (freq && freq.unit === 'hour') return iso.slice(0, 13).replace('T', ' ') + ':00'; if (freq && (freq.unit === 'month' || freq.unit === 'quarter')) return iso.slice(0, 7); if (freq && freq.unit === 'year') return iso.slice(0, 4); return iso.slice(0, 10); }
const mlabel = m => Eng.METRICS[m].label;
const betterWord = m => Eng.METRICS[m].better === 'higher' ? 'higher is better' : 'lower is better';
function pct(x) { return (x * 100).toFixed(x < 0.1 ? 1 : 0) + '%'; }
function plural(n, w) { return n.toLocaleString('en-US') + ' ' + w + (n === 1 ? '' : 's'); }

/* ================= toast + tooltip ================= */
let toastTimer;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 6000 : 3200); }
const tip = $('#tip');
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (!el) { tip.hidden = true; return; } tip.textContent = el.getAttribute('data-tip'); tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
document.addEventListener('scroll', () => tip.hidden = true, true);

/* ================= charts ================= */
function niceTicks(lo, hi, n) {
  n = n || 5; if (!(hi > lo)) { hi = lo + (Math.abs(lo) || 1); }
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const t = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.5; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < hi) t.push(t[t.length - 1] + step);
  return t;
}
function scatterSVG(sample, target) {
  const W = 560, H = 340, L = 62, R = 14, T = 12, B = 46;
  const vals = sample.map(p => p.actual).concat(sample.map(p => p.pred));
  const ticks = niceTicks(Math.min.apply(null, vals), Math.max.apply(null, vals), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const sx = v => L + (v - lo) / (hi - lo) * (W - L - R), sy = v => H - B - (v - lo) / (hi - lo) * (H - T - B);
  let g = '';
  ticks.forEach(t => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${L - 8}" y="${sy(t) + 4}" text-anchor="end">${esc(fmtNum(t))}</text><text x="${sx(t)}" y="${H - B + 17}" text-anchor="middle">${esc(fmtNum(t))}</text>`; });
  g += `<line class="base" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  g += `<line x1="${sx(lo)}" y1="${sy(lo)}" x2="${sx(hi)}" y2="${sy(hi)}" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  g += `<text x="${sx(hi) - 6}" y="${sy(hi) + 16}" text-anchor="end" class="axis-title">perfect prediction</text>`;
  sample.forEach(p => { g += `<circle class="pt" cx="${sx(p.actual).toFixed(1)}" cy="${sy(p.pred).toFixed(1)}" r="4" data-tip="Actual ${esc(fmtFull(p.actual))}\nPredicted ${esc(fmtFull(p.pred))}\nOff by ${esc(fmtFull(p.pred - p.actual))}"/>`; });
  g += `<text class="axis-title" x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle">Actual ${esc(target)}</text>`;
  g += `<text class="axis-title" transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">Predicted</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted versus actual values on held-out rows">${g}</svg>`;
}
function lineSVG(o) {
  // o: {series:[{name, times, values, color, dash}], band:{times, lo, hi, color}, marker:{t,label}, freq, height}
  const W = 640, H = o.height || 300, L = 58, R = 14, T = 16, B = 34;
  let tmin = Infinity, tmax = -Infinity, vmin = Infinity, vmax = -Infinity;
  const all = o.series.concat(o.band ? [{ times: o.band.times, values: o.band.lo }, { times: o.band.times, values: o.band.hi }] : []);
  all.forEach(s => s.times.forEach((t, i) => { tmin = Math.min(tmin, t); tmax = Math.max(tmax, t); const v = s.values[i]; if (!isNaN(v)) { vmin = Math.min(vmin, v); vmax = Math.max(vmax, v); } }));
  const ticks = niceTicks(vmin, vmax, 5); const lo = ticks[0], hi = ticks[ticks.length - 1];
  const sx = t => L + (t - tmin) / Math.max(1, tmax - tmin) * (W - L - R), sy = v => H - B - (v - lo) / (hi - lo) * (H - T - B);
  let g = '';
  ticks.forEach(t => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${L - 8}" y="${sy(t) + 4}" text-anchor="end">${esc(fmtNum(t))}</text>`; });
  g += `<line class="base" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  const nt = 5; for (let k = 0; k <= nt; k++) { const t = tmin + (tmax - tmin) * k / nt; g += `<text x="${sx(t)}" y="${H - B + 17}" text-anchor="${k === 0 ? 'start' : k === nt ? 'end' : 'middle'}">${esc(fmtDate(t, o.freq))}</text>`; }
  if (o.marker) { const x = sx(o.marker.t); g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="${x + 6}" y="${T + 10}" class="axis-title">${esc(o.marker.label)}</text>`; }
  if (o.band) { const b = o.band; let d = b.times.map((t, i) => `${i ? 'L' : 'M'}${sx(t).toFixed(1)},${sy(b.hi[i]).toFixed(1)}`).join(''); for (let i = b.times.length - 1; i >= 0; i--) d += `L${sx(b.times[i]).toFixed(1)},${sy(b.lo[i]).toFixed(1)}`; g += `<path d="${d}Z" fill="${b.color}" fill-opacity=".16"/>`; }
  o.series.forEach(s => { const d = s.times.map((t, i) => `${i ? 'L' : 'M'}${sx(t).toFixed(1)},${sy(s.values[i]).toFixed(1)}`).join(''); g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="6 4"' : ''}/>`; if (s.times.length) { const k = s.times.length - 1; g += `<circle cx="${sx(s.times[k])}" cy="${sy(s.values[k])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; } });
  // hover columns
  const tset = new Map();
  o.series.forEach(s => s.times.forEach((t, i) => { if (!tset.has(t)) tset.set(t, []); tset.get(t).push(s.name + ': ' + fmtFull(s.values[i])); }));
  if (o.band) o.band.times.forEach((t, i) => { if (tset.has(t)) tset.get(t).push('Likely range: ' + fmtFull(o.band.lo[i]) + ' – ' + fmtFull(o.band.hi[i])); });
  const ts = Array.from(tset.keys()).sort((a, b) => a - b);
  ts.forEach((t, i) => { const x0 = i ? (sx(ts[i - 1]) + sx(t)) / 2 : sx(t) - 3, x1 = i < ts.length - 1 ? (sx(t) + sx(ts[i + 1])) / 2 : sx(t) + 3; g += `<rect class="hov" x="${x0.toFixed(1)}" y="${T}" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${H - T - B}" data-tip="${attr(fmtDate(t, o.freq) + '\n' + tset.get(t).join('\n'))}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(o.label || 'Time series chart')}">${g}</svg>`;
}
function legend(items) { return `<div class="legend">${items.map(i => `<span><i class="${i.band ? 'band' : ''} ${i.dash ? 'dash' : ''}" style="background:${i.color};color:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`; }
function histSVG(hist, label) {
  const W = 560, H = 190, L = 12, R = 12, T = 10, B = 30; const n = hist.counts.length; const mx = Math.max.apply(null, hist.counts) || 1;
  const bw = (W - L - R) / n; let g = '';
  hist.counts.forEach((c, i) => { const h = (H - T - B) * c / mx; const a = hist.lo + (hist.hi - hist.lo) * i / n, b = hist.lo + (hist.hi - hist.lo) * (i + 1) / n; g += `<rect class="hbar" x="${(L + i * bw + 1).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" data-tip="${attr(fmtNum(a) + ' to ' + fmtNum(b) + '\n' + c + ' rows')}"/>`; });
  g += `<line class="base" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  g += `<text x="${L}" y="${H - 10}">${esc(fmtNum(hist.lo))}</text><text x="${W - R}" y="${H - 10}" text-anchor="end">${esc(fmtNum(hist.hi))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(label)}">${g}</svg>`;
}
function miniHist(hist) {
  if (!hist || !hist.counts) return '';
  const W = 96, H = 24, n = hist.counts.length, mx = Math.max.apply(null, hist.counts) || 1, bw = W / n; let g = '';
  hist.counts.forEach((c, i) => { const h = Math.max(c ? 1.5 : 0, (H - 2) * c / mx); g += `<rect x="${(i * bw).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--series-1)" fill-opacity=".7"/>`; });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="display:block">${g}</svg>`;
}
function hbars(items, fmt) {
  const mx = Math.max.apply(null, items.map(i => i.v).concat([1e-12]));

/* ================= data helpers ================= */

  S.cols = {}; S.profile.columns.forEach(c => S.cols[c.name] = { include: c.role === 'feature', type: ['numeric', 'categorical', 'date'].includes(c.type) ? c.type : 'categorical' });
  S.goal = { target: null, task: null, dateCol: null, agg: 'sum', horizon: null };
  S.exp = null; S.inspect = {}; S.tune = null; S.selKey = null; S.metric = null; S.params = {}; S.split = { validFrac: 0.2, orderBy: '' }; S.visited = { data: true }; S.savedFromExp = false;

}
function colProfile(name) { return S.profile && S.profile.columns.find(c => c.name === name); }
function featureList() { return S.profile.columns.filter(c => c.name !== S.goal.target && S.cols[c.name].include).map(c => ({ name: c.name, type: S.cols[c.name].type })); }

function currentMetric() {
  if (S.metric) return S.metric;
  const t = S.goal.task; if (!t) return 'rmse';
  return Eng.defaultMetric(t, t === 'classification' ? classCounts().map(e => e[1]) : []);
}
function setupObj() {
  const g = S.goal;
  if (g.task === 'forecast') return { task: 'forecast', dateCol: g.dateCol, target: g.target, agg: g.agg, horizon: g.horizon, algos: S.algos.filter(a => ['baseline', 'linear', 'forest', 'boosting'].includes(a)), metric: currentMetric(), params: S.params, detrend: S.detrend, seed: 7 };
  return { task: g.task, target: g.target, features: featureList(), validFrac: S.split.validFrac, orderBy: S.split.orderBy || null, algos: S.algos, metric: currentMetric(), params: S.params, maxRows: S.maxRows, seed: 7 };
}
function setupHash() { const s = setupObj(); delete s.algos; delete s.params; delete s.metric; return JSON.stringify(s) + '|' + (S.table ? S.table.rows.length : 0) + '|' + (S.source && S.source.name); }

function chooseTarget(name) {

  const sug = Eng.suggestTask(S.profile, name);

/* ================= file loading ================= */
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxLoading = null; rej(new Error('The spreadsheet reader could not load. Save the sheet as CSV and upload that instead.')); }; document.head.appendChild(s); });
  return xlsxLoading;
}
async function readTableFile(file) {
  const name = file.name || 'data'; const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') {
    await loadXLSX(); const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]]; return Eng.fromMatrix(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }));
  }
  if (ext === 'parquet' || ext === 'parq' || ext === 'pq') return readParquet(await file.arrayBuffer());
  const text = await file.text();
  if (ext === 'json') {
    let arr = JSON.parse(text); if (!Array.isArray(arr)) arr = arr.rows || arr.data || [];
    return Eng.fromObjects(arr);
  }
  return Eng.parseCSV(text);
}
// Parquet: hyparquet (pure JS, Snappy built in) plus pure-JS gzip and zstd decoders, loaded on first use
const CDN = 'https://cdn.jsdelivr.net/npm/';
let parquetLibs = null;
function loadParquetLibs() {
  if (!parquetLibs) parquetLibs = Promise.all([
    import(CDN + 'hyparquet@1.31.2/src/index.js'),
    import(CDN + 'fzstd@0.1.1/esm/index.mjs'),
    import(CDN + 'fflate@0.8.2/esm/browser.js'),
  ]).catch(e => { parquetLibs = null; throw new Error('The Parquet reader could not load. Check your connection, or save the file as CSV.'); });
  return parquetLibs;
}
const PARQUET_MAX_ROWS = 100000;
async function readParquet(buf) {
  const [hp, zstd, fflate] = await loadParquetLibs();
  const compressors = {
    ZSTD: (input, n) => zstd.decompress(input, new Uint8Array(n)),
    GZIP: input => fflate.gunzipSync(input),
  };
  let meta;
  try { meta = hp.parquetMetadata(buf); } catch (e) { throw new Error('This does not look like a valid Parquet file.'); }
  const total = Number(meta.num_rows);
  try {
    const objs = await hp.parquetReadObjects({ file: buf, compressors, rowStart: 0, rowEnd: Math.min(total, PARQUET_MAX_ROWS) });
    const tbl = Eng.fromObjects(objs);
    if (!tbl.columns.length) tbl.columns = hp.parquetSchema(meta).children.map(c => c.element.name);
    if (total > PARQUET_MAX_ROWS) tbl.note = 'Only the first ' + PARQUET_MAX_ROWS.toLocaleString('en-US') + ' of ' + total.toLocaleString('en-US') + ' rows were loaded.';
    return tbl;
  } catch (e) {
    const m = String(e && e.message || e);
    if (/compress|codec/i.test(m)) throw new Error('This file uses a compression Tabula cannot read yet (' + m + '). Snappy, gzip, zstd and uncompressed files work.');
    throw e;
  }
}

/* ================= downloads ================= */
let downloads = null;
async function offerFile(filename, data) {
  if (!downloads) {
    if (!window.claude) { // standalone hosting: a normal browser download
      const type = /\.json$/.test(filename) ? 'application/json' : 'text/csv';
      const url = URL.createObjectURL(new Blob([data], { type })); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return;
    }
    try { await navigator.clipboard.writeText(data); toast('Downloads are not available here, so the contents were copied to your clipboard.'); } catch (e) { toast('Downloads are not available in this view.', true); } return;
  }
  try { await downloads.save({ filename, data }); } catch (e) { if (e && e.code !== 'declined') toast('The file could not be saved: ' + (e.message || e.code), true); }
}

/* ================= rendering: frame ================= */
function stepState(id) {
  const hasData = !!S.table, hasGoal = hasData && !!S.goal.target && !!S.goal.task, hasExp = !!S.exp;
  switch (id) {
    case 'data': return hasData ? 'done' : 'open';
    case 'goal': return !hasData ? 'locked' : hasGoal ? 'done' : 'open';
    case 'prepare': return !hasGoal ? 'locked' : S.visited.prepare ? 'done' : 'open';
    case 'train': return !hasGoal ? 'locked' : hasExp ? 'done' : 'open';
    case 'evaluate': return !hasExp ? 'locked' : S.savedFromExp ? 'done' : 'open';
    case 'predict': return S.models.length ? 'open' : 'locked';
    case 'library': return 'open';
  }
}
function renderRail() {

    const s = stepState(st.id);

  });

}

function head(n, title, lede) { return `<div class="page-head">${n ? `<div class="eyebrow">Step ${n} of 6</div>` : '<div class="eyebrow">Maintain</div>'}<h1>${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div>`; }

  h += `<div class="card"><div class="card-head"><h2>Column to predict</h2>${g.target ? `<span class="pill accent">${esc(g.target)}</span>` : ''}</div><div class="colpick">`;

/* ================= step 3: prepare ================= */
function renderPrepare() {
  const g = S.goal; const p = S.profile;

    if (si.error) return h + `<div class="note critical"><span class="ic">!</span><div><p>${esc(si.error)}</p></div></div>` + footNav('goal');
    const hz = Math.min(g.horizon, Math.floor(si.values.length / 4));

    const cut = si.values.length - hz;

    if (hz < g.horizon) notes.push(`The test period is capped at ${hz} ${si.freq.unit}s, a quarter of the history.`);
    notes.forEach(n => h += `<div class="note"><span class="ic">i</span><div><p>${esc(n)}</p></div></div>`);
    h += `<label class="check"><input type="checkbox" id="detrend" ${S.detrend ? 'checked' : ''}> Remove the long-term trend before tree models learn (helps them continue a rising or falling series)</label>`;
    const others = p.columns.filter(c => c.name !== g.target && c.name !== g.dateCol && c.role === 'feature').map(c => c.name);
    if (others.length) h += `<p class="small muted">Other columns (${esc(others.slice(0, 6).join(', '))}${others.length > 6 ? '…' : ''}) are not used by forecasts in this version, because their future values are unknown.</p>`;
    h += '</div>';

        const last = m.series.times[m.series.times.length - 1];

        if (!newer.length) throw new Error('No rows are dated after ' + fmtDate(last, m.series.freq) + ', when training ended.');

  }

function mdToHTML(src) {
  const lines = String(src).replace(/\r/g, '').split('\n'); let out = '', list = null, code = null;
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  let para = [];
  const flush = () => { if (para.length) { out += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  for (const ln of lines) {
    if (code !== null) { if (/^```/.test(ln)) { out += `<pre>${esc(code)}</pre>`; code = null; } else code += ln + '\n'; continue; }
    if (/^```/.test(ln)) { flush(); close(); code = ''; continue; }
    let m;
    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { flush(); if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { flush(); if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = ln.match(/^#{1,4}\s+(.*)/))) { flush(); close(); out += `<p><b>${inline(m[1])}</b></p>`; continue; }
    if (!ln.trim()) { flush(); close(); continue; }
    close(); para.push(ln);
  }
  if (code !== null) out += `<pre>${esc(code)}</pre>`;
  flush(); close(); return out;
}

  const sg = S.pred.single;
  if (sg) { const m = S.models.find(x => x.id === sg.modelId); if (m) L.push(`Last single prediction with "${m.name}": inputs ${JSON.stringify(sg.row).slice(0, 600)} → ${m.task === 'regression' ? fmtFull(sg.out.value) : sg.out.value + ' (' + m.classes.map((c, k) => c + ' ' + pct(sg.out.probs[k])).join(', ') + ')'}. Biggest effects vs typical values: ${sg.explain.slice(0, 6).map(e => e.feature + ' ' + (m.task === 'regression' ? fmtNum(e.effect) : (e.effect * 100).toFixed(1) + ' pts')).join(', ')}`); }
  if (S.lib.check && S.lib.check.report) { const rp = S.lib.check.report; L.push('Latest drift check: ' + rp.drift.slice(0, 8).map(d => `${d.feature} PSI ${isNaN(d.psi) ? 'missing' : d.psi.toFixed(2)}`).join(', ') + (rp.performance ? '. Performance on new rows: ' + JSON.stringify(rp.performance) : '')); }
  return L.join('\n').slice(0, 24000);
}
const TOOLS = [
  { name: 'set_goal', description: 'Choose the column to predict and the prediction type. task is "regression", "classification" or "forecast". For forecast you may pass date_column. Returns the resulting goal or an error.', inputSchema: { type: 'object', properties: { target: { type: 'string' }, task: { type: 'string', enum: ['regression', 'classification', 'forecast'] }, date_column: { type: 'string' } }, required: ['target'] },
    execute(i, ctx) { if (!S.table) throw new Error('No data loaded.'); const t = String(i.target); if (!colProfile(t)) throw new Error('No column named ' + t); chooseTarget(t); if (i.date_column) S.goal.dateCol = String(i.date_column); if (i.task) setTask(String(i.task)); else setTask(S.goal.task); ctx.act('Goal: ' + t + ' (' + S.goal.task + ')'); if (S.step === 'data') S.step = 'goal'; render(); return { target: S.goal.target, task: S.goal.task, dateCol: S.goal.dateCol }; } },
  { name: 'set_columns', description: 'Include or leave out input columns. Pass column names in exclude and/or include. Returns the list of included input columns.', inputSchema: { type: 'object', properties: { exclude: { type: 'array', items: { type: 'string' } }, include: { type: 'array', items: { type: 'string' } } } },
    execute(i, ctx) { if (!S.table) throw new Error('No data loaded.'); const bad = []; (i.exclude || []).forEach(n => S.cols[n] ? S.cols[n].include = false : bad.push(n)); (i.include || []).forEach(n => S.cols[n] ? S.cols[n].include = true : bad.push(n)); if ((i.exclude || []).length) ctx.act('Left out ' + i.exclude.join(', ')); if ((i.include || []).length) ctx.act('Included ' + i.include.join(', ')); render(); return { included: featureList().map(f => f.name), unknown: bad }; } },
  { name: 'choose_models', description: 'Set which algorithms to train. Allowed names: linear, tree, forest, boosting, knn. The baseline is always added.', inputSchema: { type: 'object', properties: { models: { type: 'array', items: { type: 'string', enum: ['linear', 'tree', 'forest', 'boosting', 'knn'] } } }, required: ['models'] },
    execute(i, ctx) { S.algos = ['baseline'].concat((i.models || []).filter(x => Eng.MODELS[x] && x !== 'baseline')); ctx.act('Models: ' + S.algos.slice(1).join(', ')); render(); return { algos: S.algos }; } },
  { name: 'go_to_step', description: 'Open a step in the app: data, goal, prepare, train, evaluate, predict or library.', inputSchema: { type: 'object', properties: { step: { type: 'string', enum: ['data', 'goal', 'prepare', 'train', 'evaluate', 'predict', 'library'] } }, required: ['step'] },
    execute(i, ctx) { const s = String(i.step); if (stepState(s) === 'locked') throw new Error('That step is not available yet; earlier steps are unfinished.'); go(s); ctx.act('Opened ' + s); return 'ok'; } },
  { name: 'train_models', description: 'Train the selected algorithms with the current settings (takes a few seconds) and return the leaderboard.', inputSchema: { type: 'object', properties: {} },
    async execute(i, ctx) { if (!S.goal.task) throw new Error('Choose a goal first.'); ctx.status('Training models…'); S.step = 'train'; await train(); if (!S.exp) throw new Error('Training failed.'); ctx.act('Trained ' + S.exp.results.length + ' models'); const m = currentMetric(); return sortedResults().map(r => ({ model: r.label, [mlabel(m)]: fmtMetric(m, r.valid[m]) })); } },
];
function copyFor(code) {
  return { rate_limited: 'Too many requests right now. Try again in a minute.', session_expired: 'Your session expired. Sign in again to use the assistant.', refused: 'The assistant could not answer that. Try rephrasing.', prompt_too_large: 'Too much context to send. Try a smaller dataset view.', empty_completion: 'No answer came back. Try asking differently.', upstream_error: 'The connection dropped. Try again.' }[code] || 'Something went wrong. Try again.';
}
async function ask(q) {
  if (!sampleFn) return;
  if (!S.assistOpen) { S.assistOpen = true; render(); }
  S.chat.push({ role: 'user', content: q });
  const msg = { role: 'assistant', content: '', pending: true, acts: [] }; S.chat.push(msg); const idx = S.chat.length - 1;
  renderChat(); renderChips();
  const hist = S.chat.slice(0, -1).filter(m => m.content && !m.error).slice(-12).map(m => ({ role: m.role, content: m.content }));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const turns = [{ role: 'user', content: RULES + '\n\n<app_state>\n' + contextSummary() + '\n</app_state>' }].concat(hist);
  const ctl = new AbortController(); S.chatCtl = ctl;
  const ctx = { act: a => { msg.acts.push(a); updateMsg(idx); }, status: s => { msg.status = s; updateMsg(idx); } };
  const opts = { signal: ctl.signal, cache: false, onText: ({ text }) => { msg.content = text; msg.status = null; updateMsg(idx); } };
  if (sampleTools) opts.tools = TOOLS.map(t => ({ name: t.name, description: t.description, inputSchema: t.inputSchema, execute: inp => t.execute(inp || {}, ctx) }));
  try { const { text } = await sampleFn(turns, opts); msg.content = text; }
  catch (e) {
    msg.content = e && e.text ? e.text : msg.content;
    if (e && e.code === 'cancelled') { if (!msg.content) msg.content = '_Stopped._'; }
    else if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) { assistState = 'off'; msg.pending = false; renderAssistant(); return; }
    else if (e && e.code === 'tools_unavailable') { sampleTools = false; msg.error = 'Actions are not available here. Ask again for a plain answer.'; }
    else msg.error = copyFor(e && e.code);
  }
  msg.pending = false; msg.status = null; renderChat(); renderChips();
}

/* ================= boot ================= */
async function boot() {
  try {
    const t = Eng.makeSample('churn');
    setTable(t, { name: Eng.samples.churn.title + ' (sample)', kind: 'sample', sampleKey: 'churn' });
  } catch (e) { }
  render(); renderAssistant();
  try { S.models = ((await Store.allModels()) || []).sort((a, b) => b.created - a.created); } catch (e) { S.models = []; }
  render();
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
    try {
      sampleFn = await window.claude.use('sample');
      if (sampleFn) { const lim = await sampleFn.limits().catch(() => null); sampleTools = !!(lim && lim.tools); assistState = 'on'; }
      else assistState = 'off';
    } catch (e) { assistState = 'off'; }
  } else { assistState = 'off'; if (S.assistOpen) { S.assistOpen = false; render(); } }
  renderAssistant();
}
boot();
})();
